# 全局配置。环境变量优先级最高（ALPACA_KEY_ID / ALPACA_SECRET / TIINGO_TOKEN / TA_PROXY）
paths:
  data: data
  reports: reports
  logs: logs

universe:
  # nasdaq_marketcap: Nasdaq 官方 screener，全市场按市值降序取前 N（当前可用）
  # ishares_iwb:     iShares 罗素1000 官方持仓 CSV（2026-10 起该端点返回 HTML 被反爬，失败会自动降级）
  source: nasdaq_marketcap
  top_n: 1000
  refresh_hours: 24
  ishares_url: "https://www.ishares.com/us/products/239726/ishares-russell-1000-etf/1467271812596.ajax?fileType=csv&fileName=IWB_holdings&dataType=fund"
  nasdaq_url: "https://api.nasdaq.com/api/screener/stocks?tableonly=true&limit=1000&offset={offset}"
  exclude_name_keywords: ["ETF", "Fund", "Warrant", "Right", "Unit"]

data:
  # 主备降级链，前面的失败才用后面的；后面的没配 key 自动跳过
  source_chain: [yahoo, alpaca, tiingo]
  start_date: "2005-01-01"
  batch_size: 60          # 每批股票数
  sleep_between_batches: 2.0
  retries: 3
  backoff_base: 4.0       # 指数退避基数秒
  incremental_lookback_days: 7   # 增量时往前多拉几天，覆盖迟到修正
  revision_tolerance: 0.001      # 重叠区间收盘价偏差超过 0.1% 视为复权漂移 -> 全量重刷
  max_missing_ratio: 0.2         # 单只股票缺失交易日比例超过该值告警

sources:
  yahoo:
    enabled: true
  alpaca:
    enabled: true
    feed: iex              # 免费账户只有 iex，sip 需付费
  tiingo:
    enabled: true

backtest:
  initial_capital: 1000000
  commission_bps: 1.0      # 单边万分之一
  slippage_bps: 2.0
  top_n: 50
  rebalance: M             # D / W / M
  benchmark: SPY

# 共振交易研究（全球行业共振，验证型）
resonance:
  proxies_csv: "config/ref/industry_proxies.csv"
  momentum_window: 63        # 动量的交易日窗口（约一个季度）
  mkt_window: 252            # 对市场因子做滚动回归的窗口
  panel_start: "2015-01-01"  # 面板起点（ADR 覆盖与 OTC 流动性约束）
  fwd_days: 20               # 未来收益窗口（交易日）
  # 少于该有效地区数的行业当期剔除。取 2 是因为 ADR 覆盖只到「美国 + 一个地区」的行业不少，
  # 取 3 会把软件/能源/国防整类踢掉，横截面只剩 6 个行业、无法做三分层。
  # 报告里必须同时给「严格子样本（有效地区 ≥3）」的结论，避免用 2 地区冒充「全球共振」。
  min_valid_regions: 2
  min_members: 1             # 单个格子最少成分数
  n_permutations: 1000
  primary_regions: ["US", "JP", "KR", "TW", "EU"]   # 进共振分的地区
  secondary_regions: ["CN"]                          # 只观察、不进主分
  score_weights:             # 先验固定，不做网格搜索
    breadth: 0.4
    min_mom: 0.4
    inv_dispersion: 0.2

# 期权 / 势垒研究（验证型，不做回测）
options:
  # Cboe 延迟接口的指数符号必须带下划线：_SPX / _NDX；SPX、^SPX 均 403
  underlyings: ["_SPX"]
  cboe_url: "https://cdn.cboe.com/api/global/delayed_quotes/options/{symbol}.json"
  marketdata_base: "https://api.marketdata.app/v1"   # token 走环境变量 MARKETDATA_TOKEN
  marketdata_history_years: 1
  gex:
    contract_multiplier: 100   # 每张合约 100 股
    min_oi: 10                 # OI 太小的行权价是噪声
    moneyness_band: 0.15       # 只用现价 ±15% 内的行权价
    front_dte: 7               # 主视图只算 7 天内到期（gamma 随到期放大，混算全链会失真）
  pin:
    horizon_days: 5            # 钉扎检验看未来几个交易日
    touch_tolerance: 0.005     # 收盘价落在行权价 ±0.5% 内算「停留」
    n_distance_buckets: 5      # 距离分层数（控制距离混淆，必须做）
    n_permutations: 500        # 置换检验次数
