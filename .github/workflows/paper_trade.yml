name: paper-trade

# 两个 job 都靠「日内时钟 + 当日收盘时间」自己判断该不该干活，cron 只是唤醒器：
#   · 收盘时间随夏令时（16:00 ET = 20:00Z 夏 / 21:00Z 冬）与早收日（13:00 ET）变化，
#     写死一个 UTC 时间必然一年错两次；
#   · GitHub Actions 的 schedule 本身会漂 5~30 分钟。
# 因此每个时段都挂一条 cron，真正的判定在 python 里（quant.live.calendar），
# 不在窗口内就直接 exit 0，不推送、不写库。
#
# 日志：run log 只留 90 天且不可查询，所以真正的证据是 data 分支里的
# state/live/（运行流水 + 决策快照）。见 docs/LIVE_LOG.md。
# 因此「回写」这一步用 if: always()——失败/中止的运行也必须留痕。

on:
  schedule:
    # 收盘前 30 分钟：16:30Z(=12:30ET 夏早收) / 17:30Z / 19:30Z / 20:30Z
    - cron: '30 16 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:
    inputs:
      kind:
        description: '强制推送类型（auto=按日历判断）'
        type: choice
        options: [auto, rebalance, week]
        default: auto
      dry_run:
        description: '只算不推（true/false）'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

env:
  PYTHONPATH: src
  TA_DATA_ROOT: ${{ github.workspace }}/data
  TA_STATE_DIR: ${{ github.workspace }}/data/state/live
  TA_RUN_ID: ${{ github.run_id }}
  TZ: Asia/Shanghai

jobs:
  signal:
    name: 盘中信号与推送
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取代码
        uses: actions/checkout@v4
      - name: 取数据分支
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -q pandas numpy pyarrow duckdb pyyaml requests
      - name: 算信号并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        # tee 一份到文件：artifact 是排错兜底，真正的回溯靠 data 分支的 state/live
        run: |
          python -m scripts.live_signal \
            --kind "${{ github.event.inputs.kind || 'auto' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            2>&1 | tee "$RUNNER_TEMP/live_signal.log"
      - name: 上传运行日志（兜底，14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-signal-${{ github.run_id }}
          path: ${{ runner.temp }}/live_signal.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 回写日志与账本到 data 分支
        # always：算信号失败时也要把 runs/ 里的 error 行提交上去，否则失败永远查不到
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          cd data
          git checkout -B data
          git config user.name  "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
            exit 0
          fi
          git commit -m "state: $(date -u +%F' '%H:%MZ) run ${{ github.run_id }}"
          for i in 1 2 3; do
            if git push origin data; then
              echo "已提交 run ${{ github.run_id }}"
              exit 0
            fi
            echo "push 失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin data || true
            sleep $((i * 3))
          done
          echo "::error::日志未能提交到 data 分支（run ${{ github.run_id }}）"
          exit 1

  data:
    name: 收盘后数据更新
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取代码
        uses: actions/checkout@v4
      - name: 取数据分支
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -q pandas numpy pyarrow duckdb pyyaml yfinance requests openpyxl
      - name: 更新行情与换手率
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
        run: python -m scripts.paper_close_update

      - name: 生成数据说明（MANIFEST.md）
        # 每次更新数据后原地重写 MANIFEST.md，跟着数据一起提交到 data 分支
        run: python -m scripts.data_manifest
      - name: 回写 data 分支
        run: |
          cd data
          git checkout -B data
          git config user.name  "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
            exit 0
          fi
          git commit -m "data: $(date -u +%F' '%H:%MZ) run ${{ github.run_id }}"
          for i in 1 2 3; do
            if git push origin data; then
              echo "已提交 run ${{ github.run_id }}"
              exit 0
            fi
            echo "push 失败（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin data || true
            sleep $((i * 3))
          done
          echo "::error::数据未能提交到 data 分支（run ${{ github.run_id }}）"
          exit 1
