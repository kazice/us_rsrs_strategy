name: cron-check

# 每日自检定时触发闭环（见 scripts/cron_sync.py）：
#   · 主路径：Cloudflare 上永久保留的每日 cron（12:15Z）经 Worker 调 workflow_dispatch；
#   · 备用路径：下面这条 GitHub schedule（会延迟，但自检不赶时间）。
# 发现 Cron 不对会自动重设，漏触发会推 pushplus。

on:
  schedule:
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cron-check
  cancel-in-progress: false

env:
  PYTHONPATH: src
  TZ: Asia/Shanghai
  ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
  ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
  TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}

jobs:
  check:
    name: 定时触发自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: 安装依赖
        run: pip install -q -r requirements-ci.txt
      - name: 自检
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.cron_sync check
