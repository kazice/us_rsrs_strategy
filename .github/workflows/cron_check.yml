name: cron-check

# Cloudflare 上永久保留一条每日 cron（12:15Z）调本 workflow 做自检：
#   · 核对 Worker 里的 cron 是否等于「现在应该有的下一次触发时刻」；
#   · 核对过去 26 小时该触发的 signal / data 是否真的发生过；
#   · 不对就自动重设并推 pushplus。
# GitHub 自己的 schedule 也挂一条：Cloudflare 整体挂掉时至少还有一次机会。

on:
  workflow_dispatch:
  schedule:
    - cron: '47 13 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: cron-check
  cancel-in-progress: false

jobs:
  check:
    name: 定时触发自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自检并自动重设
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python live/cron_sync.py check
